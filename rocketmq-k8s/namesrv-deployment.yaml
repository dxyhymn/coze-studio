apiVersion: apps/v1
kind: Deployment
metadata:
  name: rocketmq-namesrv
  namespace: rocketmq
  labels:
    app: rocketmq
    component: namesrv
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rocketmq
      component: namesrv
  template:
    metadata:
      labels:
        app: rocketmq
        component: namesrv
    spec:
      containers:
        - name: namesrv
          image: apache/rocketmq:5.3.2
          imagePullPolicy: IfNotPresent
          command: ["sh", "mqnamesrv"]
          ports:
            - name: main
              containerPort: 9876
              protocol: TCP
          env:
            - name: JAVA_OPT_EXT
              value: "-Duser.home=/home/rocketmq -Xms512m -Xmx512m -Xmn256m"
          resources:
            limits:
              cpu: 1000m
              memory: 2Gi
            requests:
              cpu: 500m
              memory: 1Gi
          livenessProbe:
            exec:
              command: ["sh", "-c", "mqadmin clusterList -n localhost:9876"]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 9876
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: namesrv-storage
              mountPath: /home/rocketmq/logs
            - name: namesrv-store
              mountPath: /home/rocketmq/store
      volumes:
        - name: namesrv-storage
          emptyDir: {}
        - name: namesrv-store
          emptyDir: {}
      restartPolicy: Always