apiVersion: apps/v1
kind: Deployment
metadata:
  name: rocketmq-console
  namespace: rocketmq
  labels:
    app: rocketmq
    component: console
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rocketmq
      component: console
  template:
    metadata:
      labels:
        app: rocketmq
        component: console
    spec:
      containers:
        - name: console
          image: styletang/rocketmq-console-ng:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: JAVA_OPTS
              value: "-Drocketmq.namesrv.addr=rocketmq-namesrv:9876 -Dcom.rocketmq.sendMessageWithVIPChannel=false -Xms256m -Xmx256m"
          resources:
            limits:
              cpu: 500m
              memory: 1Gi
            requests:
              cpu: 200m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      restartPolicy: Always