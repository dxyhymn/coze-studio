apiVersion: apps/v1
kind: Deployment
metadata:
  name: rocketmq-broker
  namespace: rocketmq
  labels:
    app: rocketmq
    component: broker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rocketmq
      component: broker
  template:
    metadata:
      labels:
        app: rocketmq
        component: broker
    spec:
      initContainers:
        - name: wait-for-namesrv
          image: busybox:latest
          command: ['sh', '-c', 'until nc -z rocketmq-namesrv 9876; do echo waiting for namesrv; sleep 2; done']
      containers:
        - name: broker
          image: apache/rocketmq:5.3.2
          imagePullPolicy: IfNotPresent
          command: ["sh", "mqbroker", "-c", "/opt/rocketmq-5.3.2/conf/broker.conf"]
          ports:
            - name: main
              containerPort: 10911
              protocol: TCP
            - name: ha
              containerPort: 10912
              protocol: TCP
            - name: vip
              containerPort: 10909
              protocol: TCP
          env:
            - name: JAVA_OPT_EXT
              value: "-Duser.home=/home/rocketmq -Xms1g -Xmx1g -Xmn512m"
            - name: NAMESRV_ADDR
              value: "rocketmq-namesrv:9876"
          resources:
            limits:
              cpu: 2000m
              memory: 4Gi
            requests:
              cpu: 1000m
              memory: 2Gi
          livenessProbe:
            tcpSocket:
              port: 10911
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 10911
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: broker-config
              mountPath: /opt/rocketmq-5.3.2/conf/broker.conf
              subPath: broker.conf
              readOnly: true
            - name: broker-storage
              mountPath: /home/rocketmq/logs
            - name: broker-store
              mountPath: /home/rocketmq/store
      volumes:
        - name: broker-config
          configMap:
            name: rocketmq-broker-config
        - name: broker-storage
          emptyDir: {}
        - name: broker-store
          emptyDir: {}
      restartPolicy: Always