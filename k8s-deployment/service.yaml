apiVersion: v1
kind: Service
metadata:
  name: opencoze-server
  namespace: opencoze
  labels:
    app: opencoze
    component: server
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8888
      targetPort: 8888
      protocol: TCP
    - name: minio-proxy
      port: 8889
      targetPort: 8889
      protocol: TCP
  selector:
    app: opencoze
    component: server