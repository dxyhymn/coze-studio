apiVersion: v1
kind: Secret
metadata:
  name: opencoze-secrets
  namespace: opencoze
type: Opaque
stringData:
  # MySQL 配置
  mysql-password: "your_mysql_password"
  mysql-dsn: "coze_user:your_mysql_password@tcp(your-mysql-host.company.com:3306)/opencoze?charset=utf8mb4&parseTime=True&loc=Local"
  
  # Redis 配置（如果有密码）
  redis-password: ""
  
  # Elasticsearch 配置
  es-username: "your_es_username"
  es-password: "your_es_password"
  
  # MinIO 配置
  minio-access-key: "your_minio_access_key"
  minio-secret-key: "your_minio_secret_key"
  
  # API Keys
  ark-embedding-api-key: ""
  ark-chat-api-key: ""
  openai-embedding-api-key: "your_openai_api_key"
  openai-chat-api-key: "your_openai_api_key"
  
  # 火山引擎相关
  ve-ocr-ak: ""
  ve-ocr-sk: ""
  ve-imagex-ak: ""
  ve-imagex-sk: ""