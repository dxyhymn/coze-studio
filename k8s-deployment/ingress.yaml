apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: opencoze-ingress
  namespace: opencoze
  labels:
    app: opencoze
  annotations:
    # 根据您公司的 Ingress Controller 调整注解
    nginx.ingress.kubernetes.io/proxy-body-size: "1024m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "600"
    # 如果使用 Traefik，使用以下注解：
    # traefik.ingress.kubernetes.io/router.middlewares: default-redirect-https@kubernetescrd
spec:
  # 如果使用特定的 Ingress Class，取消注释下面一行
  # ingressClassName: nginx
  
  rules:
    - host: coze.your-company.com  # 替换为您的实际域名
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: opencoze-server
                port:
                  number: 8888
  
  # 如果需要 HTTPS，配置 TLS（取消注释下面的配置）
  # tls:
  #   - hosts:
  #       - coze.your-company.com
  #     secretName: opencoze-tls