apiVersion: v1
kind: ConfigMap
metadata:
  name: opencoze-config
  namespace: opencoze
data:
  # 基础服务配置
  LISTEN_ADDR: ":8888"
  SERVER_HOST: "localhost:8888"
  LOG_LEVEL: "info"
  MAX_REQUEST_BODY_SIZE: "1073741824"
  
  # 存储配置
  STORAGE_TYPE: "minio"
  MINIO_PROXY_ENDPOINT: ":8889"
  STORAGE_BUCKET: "opencoze"
  
  # 消息队列配置
  COZE_MQ_TYPE: "rmq"
  
  # Elasticsearch 配置
  ES_VERSION: "v8"
  
  # 向量数据库配置
  VECTOR_STORE_TYPE: "milvus"
  
  # 嵌入模型配置
  EMBEDDING_TYPE: "ark"
  ARK_EMBEDDING_MODEL: ""
  ARK_EMBEDDING_DIMS: "1024"
  ARK_EMBEDDING_BASE_URL: "https://ark.cn-beijing.volces.com/api/v3"
  
  # OpenAI 嵌入配置
  OPENAI_EMBEDDING_BASE_URL: "https://api.openai.com/v1/embeddings"
  OPENAI_EMBEDDING_MODEL: "text-embedding-3-large"
  OPENAI_EMBEDDING_BY_AZURE: "false"
  OPENAI_EMBEDDING_DIMS: "1024"
  
  # 文件上传配置
  FILE_UPLOAD_COMPONENT_TYPE: "storage"
  
  # OCR 配置
  OCR_TYPE: "ve"
  
  # 内置聊天模型配置
  BUILTIN_CM_TYPE: "ark"
  BUILTIN_CM_ARK_MODEL: ""
  BUILTIN_CM_ARK_BASE_URL: ""
  BUILTIN_CM_OPENAI_BASE_URL: "https://api.openai.com/v1/chat/completions"
  BUILTIN_CM_OPENAI_BY_AZURE: "false"
  BUILTIN_CM_OPENAI_MODEL: "gpt-4o-2024-05-13"
  
  # 图像服务配置
  VE_IMAGEX_SERVER_ID: ""
  VE_IMAGEX_DOMAIN: ""
  VE_IMAGEX_TEMPLATE: ""
  VE_IMAGEX_UPLOAD_HOST: "https://imagex.volcengineapi.com"
  
  # ===== 外部中间件连接配置 =====
  # MySQL 配置
  MYSQL_HOST: "your-mysql-host.company.com"
  MYSQL_PORT: "3306"
  MYSQL_USER: "coze_user"
  MYSQL_DATABASE: "opencoze"
  
  # Redis 配置
  REDIS_ADDR: "your-redis-host.company.com:6379"
  
  # Elasticsearch 配置
  ES_ADDR: "http://your-elasticsearch-host.company.com:9200"
  
  # MinIO 配置
  MINIO_ENDPOINT: "your-minio-host.company.com:9000"
  MINIO_API_HOST: "http://your-minio-host.company.com:9000"
  
  # Milvus 配置
  MILVUS_ADDR: "your-milvus-host.company.com:19530"
  
  # RocketMQ 配置
  MQ_NAME_SERVER: "http://your-rocketmq-host.company.com:9876"